    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #F5F0E8;
        color: #334155;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-splash .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid #EDE5D4;
        border-top-color: #1B3A35;
        animation: splashSpin 0.8s linear infinite;
      }
      #app-splash p {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      @keyframes splashSpin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <div class="spinner"></div>
        <p>DeutschBuddy</p>
      </div>
    </div>
